pluginManagement {
    includeBuild('build-logic')
    includeBuild('asset-pipeline')
}

plugins {
    id 'cloud.wondrify.repositories'
}

include(
        'asset-pipeline-bom',
        'asset-pipeline-spring-boot',
        'less-asset-pipeline',
        'coffee-asset-pipeline',
        'sass-asset-pipeline',
        'handlebars-asset-pipeline',
        'ember-asset-pipeline',
        'asset-pipeline-servlet',
        'asset-pipeline-docs',
        'sass-dart-asset-pipeline',
        'asset-pipeline-grails',
        'jsx-asset-pipeline',
        'i18n-asset-pipeline-grails',
        'asset-pipeline-gsp'
)

// org.groocss:groocss:1.0-M1 is no longer available, was on https://jcenter.bintray.com/
// removed 'groocss-asset-pipeline' from include

// Core and the Gradle plugin are built by their own build in asset-pipeline/, which this build includes to resolve
// cloud.wondrify:asset-pipeline-core and cloud.wondrify:asset-pipeline-gradle and to apply the plugin
includeBuild('asset-pipeline')
