version=5.2.0-SNAPSHOT
grailsVersion=8.0.0-M6
javaVersion=21
bootstrapCssVersion=5.3.8
closureCompilerVersion=v20260811
fluentHcVersion=4.5.14
graalvmVersion=25.2.4
# Core and plugins are compiled with Groovy 4 as they are used by the Gradle Plugin (Gradle 9 embeds Groovy 4)
groovy4Version=4.0.33
# Grails 8 / Spring Boot 4 applications run Groovy 5 (managed by grails-bom)
groovy5Version=5.0.8
httpcoreVersion=4.4.16
javaparserVersion=3.28.2
javetVersion=5.0.10
jettyVersion=12.1.12
jsassVersion=5.11.1
junit4Version=4.13.2
less4jVersion=1.17.2
less4jJsVersion=0.0.1
protobufVersion=3.25.9
rhinoVersion=1.9.1
servletApiVersion=6.1.0
slf4jVersion=2.0.18
# Spock for the Gradle-side (Groovy 4) modules
spockVersion=2.4-groovy-4.0
# Spock for the modules compiled against Groovy 5; the Grails plugin gets its own from grails-bom
spock5Version=2.4-groovy-5.0
springVersion=7.0.8
springBootVersion=4.1.0
webjarsLocatorVersion=0.59

org.gradle.warning.mode=none

# Gradle 9 defaults the daemon to 512m heap / 384m metaspace, which is not enough for this
# multi-module build. The release build in particular compiles, groovydocs, signs and publishes
# ~20 subprojects in a single daemon and dies with "the JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
