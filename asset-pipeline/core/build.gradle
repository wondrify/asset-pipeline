apply plugin: 'groovy'

group = 'cloud.wondrify'

ext {
    pomDescription = 'JVM Asset Pipeline library for serving static web assets, bundling, minifying, and extensibility for transpiling.'
}

configurations {
    provided
    doc.extendsFrom(runtime)
}

sourceSets {
    main {
        compileClasspath += configurations.provided
        groovy.srcDirs += ['src/main/java']
        java.srcDirs = []
    }
}

dependencies {

    doc "org.apache.groovy:groovy:$groovy4Version"
    doc "org.apache.groovy:groovy-ant:$groovy4Version"
    doc "org.apache.groovy:groovy-templates:$groovy4Version"
    doc "com.github.javaparser:javaparser-core:$javaparserVersion"

    // Needs to be compiled with Groovy 4 as it is used by the Gradle Plugin (Gradle 9 embeds Groovy 4)
    compileOnly "com.google.javascript:closure-compiler-unshaded:$closureCompilerVersion"
    compileOnly "com.google.guava:guava:33.6.0-jre" // required for closure-compiler-unshaded - com.google.common.base.Predicate is missing otherwise
    compileOnly "org.apache.groovy:groovy:$groovy4Version"
    compileOnly "org.apache.groovy:groovy-json:$groovy4Version"
    compileOnly "org.apache.groovy:groovy-templates:$groovy4Version"
    compileOnly "org.graalvm.polyglot:polyglot:$graalvmVersion"
    compileOnly "org.slf4j:slf4j-api:$slf4jVersion"

    testImplementation project(':asset-pipeline-classpath-test')
    testImplementation "org.apache.groovy:groovy:$groovy4Version"
    testImplementation platform("org.spockframework:spock-bom:$spockVersion")
    testImplementation "org.spockframework:spock-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher" // version managed by junit-bom (via spock); required by Gradle 9


    testImplementation "org.webjars.npm:jquery:3.7.1"
    testImplementation "org.webjars.npm:bootstrap:5.3.0"

    testRuntimeOnly "com.google.javascript:closure-compiler-unshaded:$closureCompilerVersion"
    testRuntimeOnly "org.graalvm.js:js-community:$graalvmVersion"
    testRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
}

tasks.register('console', JavaExec) {
    dependsOn('classes')
    mainClass = 'groovy.ui.Console'
    classpath = sourceSets.main.runtimeClasspath
}

// The tasks below take the names and files of the configurations they list while they are configured, as the
// configuration cache restores their actions without the project or this script's methods
def listConfigurationDependencies = { String configurationName, Set<File> files ->
    def formatStr = "%,10.2f"

    def size = files.collect { it.length() / (1024 * 1024) }.sum()

    def out = new StringBuffer()
    out << "\nConfiguration name: \"${configurationName}\"\n"
    if (size) {
        out << 'Total dependencies size:'.padRight(65)
        out << "${String.format(formatStr, size)} Mb\n\n"

        files.sort { -it.length() }
                .each {
                    out << "${it.name}".padRight(65)
                    out << "${String.format(formatStr, (it.length() / 1024))} kb\n"
                }
    } else {
        out << 'No dependencies found'
    }
    out.toString()
}

tasks.register("depsize") {
    description = 'Prints dependencies for "default" configuration'
    Map<String, FileCollection> listed = [(configurations.runtimeClasspath.name): configurations.runtimeClasspath]
    doLast() {
        for (Map.Entry<String, FileCollection> configuration : listed) {
            println(listConfigurationDependencies(configuration.key, configuration.value.files))
        }
    }
}

tasks.register("depsize-all-configurations") {
    description = 'Prints dependencies for all available configurations'
    Map<String, FileCollection> listed = configurations
            .findAll { it.isCanBeResolved() }
            .collectEntries { [(it.name): it] }
    doLast() {
        for (Map.Entry<String, FileCollection> configuration : listed) {
            println(listConfigurationDependencies(configuration.key, configuration.value.files))
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

apply {
    plugin 'cloud.wondrify.java-config'
    plugin 'cloud.wondrify.publish-config'
}

tasks.named('groovydoc', Groovydoc).configure { Groovydoc it ->
    it.docTitle "Asset Pipeline Core"
    it.windowTitle "Asset Pipeline For the JVM API Doc"
    it.groovyClasspath = configurations.doc
    it.classpath = configurations.runtime
    // Links to external Javadoc, currently only the J2SE links are working properly
    it.link('http://download.oracle.com/javase/8/docs/api/', 'java.', 'org.xml', 'javax.', 'org.xml.')
    it.link('http://groovy.codehaus.org/api/', 'groovy.', 'org.apache.groovy.')
}

tasks.named('javadocJar', Jar).configure { Jar it ->
    // TODO: help-doc.html is a duplicate
    it.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}