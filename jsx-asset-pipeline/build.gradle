buildscript {
    repositories {
        // mavenLocal()
        mavenCentral()
    }
    dependencies {
        // The JFlex version the org.xbib.gradle.plugin.jflex plugin, which this build used, generated the lexer with
        classpath 'de.jflex:jflex:1.6.1'
    }
}

apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'JSX Transpiler Extension for the JVM Based Asset-Pipeline.'
}

configurations {
    provided
}
sourceSets {
    main {
        compileClasspath += configurations.provided
    }
}

dependencies {

    api "cloud.wondrify:asset-pipeline-core:$version"

    // Needs to be compiled with Groovy 4 as it is used by the Gradle Plugin (Gradle 9 embeds Groovy 4)
    compileOnly "org.apache.groovy:groovy:$groovy4Version"
    compileOnly "org.graalvm.polyglot:polyglot:$graalvmVersion"

    testImplementation "org.apache.groovy:groovy:$groovy4Version"
    testImplementation "org.graalvm.js:js-community:$graalvmVersion"
    testImplementation platform("org.spockframework:spock-bom:$spockVersion")
    testImplementation "org.spockframework:spock-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher" // version managed by junit-bom (via spock); required by Gradle 9
}

/**
 * Generates a lexer from each JFlex specification, in the directory of its package, as the jflex task of the
 * org.xbib.gradle.plugin.jflex plugin did. That task used the project while it ran, which the configuration cache
 * does not support.
 */
abstract class GenerateLexers extends DefaultTask {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSource()

    @OutputDirectory
    abstract DirectoryProperty getGenerateDir()

    @javax.inject.Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void generate() {
        File generateDir = getGenerateDir().get().asFile
        fileSystemOperations.delete { it.delete(generateDir) }
        generateDir.mkdirs()
        source.asFileTree.matching { include('**/*.jflex') }.visit { FileVisitDetails details ->
            if (!details.directory) {
                String packageDirectory = new File(generateDir, details.relativePath.parent.pathString).absolutePath
                jflex.Main.generate(['-q', details.file.absolutePath, '-d', packageDirectory + '/'] as String[])
            }
        }
    }
}

def generateLexers = tasks.register('jflex', GenerateLexers) {
    source = layout.projectDirectory.dir('src/main/jflex')
    generateDir = layout.buildDirectory.dir('generated-src/jflex')
}

sourceSets {
    main {
        java.srcDir(generateLexers.flatMap { it.generateDir })
    }
}

tasks.register('console', JavaExec) {
  dependsOn('classes')
  mainClass = 'groovy.ui.Console'
  classpath = sourceSets.main.runtimeClasspath
}

test {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

apply {
    plugin 'cloud.wondrify.java-config'
    plugin 'cloud.wondrify.publish-config'
}

tasks.named('sourcesJar', Jar).configure {
    it.dependsOn(generateLexers)
}

tasks.named('javadocJar', Jar).configure { Jar it ->
    // TODO: help-doc.html is a duplicate
    it.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}