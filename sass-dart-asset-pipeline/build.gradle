apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'Provides SASS Compiling using jsass (libsass) support for the Asset-Pipeline library.'
    pomDevelopers = ['gferon': 'Gabriel Féron']
}

configurations {
    provided
}
 
sourceSets {
    main {
        compileClasspath += configurations.provided
    }
    test {
        compileClasspath += configurations.provided
    }
}

apply plugin: 'com.github.node-gradle.node'

dependencies {

    api "cloud.wondrify:asset-pipeline-core:$version"

    implementation "com.caoccao.javet:javet:$javetVersion"

    compileOnly "org.apache.groovy:groovy:$groovy4Version"
    compileOnly "org.slf4j:slf4j-api:$slf4jVersion"

    testImplementation "org.apache.groovy:groovy:$groovy4Version"
    testImplementation platform("org.spockframework:spock-bom:$spockVersion")
    testImplementation "org.spockframework:spock-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher" // version managed by junit-bom (via spock); required by Gradle 9

    testRuntimeOnly "org.webjars:webjars-locator-core:$webjarsLocatorVersion"
    testRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
    testRuntimeOnly "org.webjars:bootstrap:$bootstrapCssVersion"
}

// Resolved while configuring, as the configuration cache restores these task actions without this script's project
def javetVersionFile = file('src/main/resources/javet-version.txt')
def javetVersionText = javetVersion
def bundledCompilerDirectory = file('src/main/resources/js')

task copyJavetVersion()  {
    doLast {
        javetVersionFile.text = javetVersionText
    }
}

task bundleJSCompiler(type: NpmTask, dependsOn: ['npmInstall']) {
    doFirst {
        bundledCompilerDirectory.mkdirs()
    }
    inputs.files(fileTree('src/main/js'), file('webpack.config.js'))
    outputs.file('src/main/resources/js/compiler.js')
    args = ['run', 'bundle']
}

compileGroovy.dependsOn copyJavetVersion, bundleJSCompiler

tasks.register('console', JavaExec) {
  dependsOn('classes')
  mainClass = 'groovy.ui.Console'
  classpath = sourceSets.main.runtimeClasspath
}

test {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

node {
    download = true
    version = "16.13.0"
    distBaseUrl = null // resolved from the Node.js repository in build-logic's cloud.wondrify.repositories
}

processResources {
    dependsOn(bundleJSCompiler)
}

apply {
    plugin 'cloud.wondrify.java-config'
    plugin 'cloud.wondrify.publish-config'
}

sourcesJar {
    dependsOn(bundleJSCompiler)
}
