group = 'cloud.wondrify'

apply plugin: 'groovy'
apply plugin: 'java-library'
apply plugin: "org.apache.grails.gradle.grails-plugin"

ext {
    pomDescription = 'The Grails Asset-Pipeling plugin providing asset transpiling to grails.'
}

configurations.configureEach {
    // grails-bom pins asset-pipeline to the release it shipped with, which wins over this build's snapshot of the
    // core. This plugin is built and tested against the core it is released with.
    resolutionStrategy.dependencySubstitution {
        substitute module('cloud.wondrify:asset-pipeline-core') using project(':asset-pipeline-core')
    }
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if ((details.requested.group == 'org.codehaus.groovy' || details.requested.group == 'org.apache.groovy') && details.requested.name != 'groovy-bom') {
            details.useTarget(group: 'org.apache.groovy', name: details.requested.name, version: "$groovy5Version")
            details.because "The dependency coordinates are changed in Apache Groovy 4+, plus ensure the Groovy 5 version Grails 8 applications run"
        }
    }
}

grails {
    packageAssets = false
    bom = null // this build applies the grails-bom platform itself

    // Required for consumers building a GraalVM native image; see gradle/java-config.gradle.
    indy = true
}

dependencies {

    implementation project(':asset-pipeline-core')

    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly 'org.apache.grails:grails-url-mappings'

    compileOnly 'com.github.ben-manes.caffeine:caffeine' // Cache
    compileOnly 'jakarta.servlet:jakarta.servlet-api' // Provided by the servlet container
    compileOnly 'org.apache.grails:grails-core' // Provided as this is a Grails plugin
    compileOnly 'org.apache.grails.views:grails-web-taglib' // For taglib compilation

    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // version managed by grails-bom; required by Gradle 9

    // Lets AssetPipelineGrailsPluginSpec drive Spring's ahead-of-time processing, proving the bean
    // definitions this plugin contributes can be turned into generated source for a native image.
    testImplementation "org.springframework:spring-core-test:$springVersion"

    // WebJar testing dependencies
    testImplementation "org.webjars:webjars-locator-core:$webjarsLocatorVersion"
    testImplementation 'org.webjars.npm:jquery:3.7.1'       // specific version required by AssetsTagLibSpec
    testImplementation 'org.webjars.npm:bootstrap:5.3.0'    // specific version required by AssetsTagLibSpec
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
    }
}

bootRun {
    jvmArgs('-Dspring.output.ansi.enabled=always')
}


apply {
    from rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
}

tasks.withType(Jar).configureEach { Jar it ->
    it.exclude('grails-app/assets/**')
    it.exclude('test/**')
    
    eachFile { copyDetails ->
        if (copyDetails.path.contains('grails-plugin.xml')) {
            filter { line -> excludes.find { line.contains(it) } ? null : line }
        }
    }
}

tasks.named('javadocJar', Jar).configure { Jar it ->
    // TODO: help-doc.html is a duplicate
    it.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
