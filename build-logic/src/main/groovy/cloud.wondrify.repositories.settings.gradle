import org.gradle.api.initialization.resolve.RepositoriesMode

// The repositories every build in this repository resolves from, declared once. Projects do not declare their own.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/core' }
        maven {
            url = 'https://repository.apache.org/content/groups/snapshots'
            content {
                includeVersionByRegex('org[.]apache[.]grails.*', '.*', '.*SNAPSHOT')
            }
        }
        // Node.js distributions for the node plugin, which projects configure with `distBaseUrl = null` so that it
        // resolves them from here rather than adding a repository of its own
        ivy {
            name = 'Node.js'
            url = 'https://nodejs.org/dist/'
            patternLayout {
                artifact('v[revision]/[artifact](-v[revision]-[classifier]).[ext]')
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule('org.nodejs', 'node')
            }
        }
    }
}
