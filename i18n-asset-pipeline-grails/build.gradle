plugins {
    // The Gradle plugin in this repository, from the build in asset-pipeline/ that this build includes
    id 'cloud.wondrify.asset-pipeline' apply false
}

group = 'cloud.wondrify'

apply plugin: 'groovy'
apply plugin: 'java-library'
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin: 'cloud.wondrify.grails-bom'
apply plugin: "cloud.wondrify.asset-pipeline"

ext {
    pomDescription = 'asset-pipeline plugin to use localized messages in JavaScript.'
}

grails {
    bom = null // this build applies the grails-bom platform itself

    // Required for consumers building a GraalVM native image; see build-logic/src/main/groovy/cloud.wondrify.java-config.gradle.
    indy = true
}


dependencies {
    api platform("org.apache.grails:grails-bom:$grailsVersion")
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-logging'
    api 'org.springframework.boot:spring-boot-starter-tomcat'
    api "org.apache.grails:grails-core"
    api "org.apache.grails:grails-web-boot"
    api "org.apache.grails:grails-services"
    api "org.apache.grails:grails-url-mappings"
    api "cloud.wondrify:asset-pipeline-core:$version"
    api project(':asset-pipeline-grails')
    // api "cloud.wondrify:asset-pipeline-gradle:2.13.2"
    // api 'cloud.wondrify:asset-pipeline-grails:2.13.2'
    // api 'cloud.wondrify:asset-pipeline-core:2.13.2'

    profile 'org.apache.grails.profiles:web-plugin'
    testImplementation('org.apache.grails:grails-testing-support-web')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // version managed by grails-bom; required by Gradle 9
}


assets {
    packagePlugin = true
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
    }
}

apply {
    plugin 'cloud.wondrify.java-config'
    plugin 'cloud.wondrify.publish-config'
}


