plugins {
    // Puts build-logic, and the plugins it brings, on the classpath of every project in this build
    id 'cloud.wondrify.java-config' apply false
}

group = 'cloud.wondrify'

ext {
    publishedProjects = []
}

subprojects { project ->
    if (project.name != 'asset-pipeline-docs' && project.name != 'asset-pipeline-site') {
        publishedProjects << project.name
        apply plugin: 'org.apache.grails.gradle.grails-publish'
    }
}
