apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'Wires the Grails asset pipeline tag libraries for an application that renders GSP without being a Grails application.'
}

configurations.configureEach {
    // grails-bom constrains cloud.wondrify:asset-pipeline-*, which otherwise resolves the sibling
    // projects to the last published version - and this module is compiled against a class that is
    // generated by the plugin in this build, so the published one does not carry it.
    resolutionStrategy.dependencySubstitution {
        substitute module('cloud.wondrify:asset-pipeline-grails') using project(':asset-pipeline-grails')
        substitute module('cloud.wondrify:asset-pipeline-core') using project(':asset-pipeline-core')
    }
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if ((details.requested.group == 'org.codehaus.groovy' || details.requested.group == 'org.apache.groovy') && details.requested.name != 'groovy-bom') {
            details.useTarget(group: 'org.apache.groovy', name: details.requested.name, version: "$groovy5Version")
            details.because "The dependency coordinates are changed in Apache Groovy 4+, plus ensure the Groovy 5 version Grails 8 applications run"
        }
    }
}

dependencies {

    // The tag libraries, AssetProcessorService and the link generator this wires are the plugin's.
    // A GSP tag library is a Grails class either way, so there is no Grails-free arrangement here -
    // what this module leaves behind is the plugin lifecycle, not Grails.
    api project(':asset-pipeline-grails')
    // AssetPipelineConfigHolder; the plugin declares core `implementation`, so it is not transitive
    implementation project(':asset-pipeline-core')

    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly 'org.apache.grails:grails-core'
    // grails.artefact.TagLibrary, which the Grails compiler gives the plugin's tag libraries as a supertype
    compileOnly 'org.apache.grails.views:grails-web-gsp-taglib'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'jakarta.servlet:jakarta.servlet-api' // Provided by the servlet container

    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation 'org.apache.grails:grails-core'
    testImplementation 'org.apache.grails.views:grails-web-gsp-taglib' // StandaloneTagLibraryLookup
    // UrlMappingsHolder, which GspAutoConfiguration contributes to a standalone application and the
    // plugin's link generator autowires
    testImplementation 'org.apache.grails:grails-url-mappings'
    testImplementation "org.springframework.boot:spring-boot-test:$springBootVersion"
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // version managed by grails-bom; required by Gradle 9
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
    }
}

apply {
    from rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from rootProject.layout.projectDirectory.file('gradle/publish-config.gradle')
}
