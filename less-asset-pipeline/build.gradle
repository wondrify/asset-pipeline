apply plugin: 'groovy'
apply plugin: 'java-library'

group = 'cloud.wondrify'

ext {
    pomDescription = 'Provides LESS Compiling support for the Asset-Pipeline library.'
}

configurations {
    provided
}
 
sourceSets {
    main {
        compileClasspath += configurations.provided
    }
}

dependencies {

    api "cloud.wondrify:asset-pipeline-core:$version"
    api "org.mozilla:rhino:$rhinoVersion"
    api "com.github.sommeri:less4j:$less4jVersion"
    api "com.google.protobuf:protobuf-java:$protobufVersion"
    implementation "com.github.sommeri:less4j-javascript:$less4jJsVersion", {
        // An old forked version of Rhino is included in less4j-javascript
        exclude group: 'ro.isdc.wro4j', module: 'rhino'
    }

    // Needs to be compiled with Groovy 4 as it is used by the Gradle Plugin (Gradle 9 embeds Groovy 4)
    compileOnly "org.apache.groovy:groovy:$groovy4Version"
    compileOnly "org.slf4j:slf4j-api:$slf4jVersion"
}

tasks.register('console', JavaExec) {
  dependsOn('classes')
  mainClass = 'groovy.ui.Console'
  classpath = sourceSets.main.runtimeClasspath
}

apply {
    plugin 'cloud.wondrify.java-config'
    plugin 'cloud.wondrify.publish-config'
}


